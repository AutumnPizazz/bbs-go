name: bbs-go-instance

x-mysql-env: &mysql-env
  MYSQL_DATABASE: ${BBSGO_MYSQL_DATABASE}
  MYSQL_USER: ${BBSGO_MYSQL_USER}
  MYSQL_PASSWORD: ${BBSGO_MYSQL_PASSWORD}

services:
  mysql:
    image: mysql:8.4
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *mysql-env
      MYSQL_ROOT_PASSWORD: ${BBSGO_MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -f /var/lib/mysql/.bbsgo-restored && mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 60

  bbs-go:
    image: ${BBSGO_IMAGE}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./runtime/data:/app/data
      - ./runtime/logs:/app/logs
      - ./runtime/uploads:/app/res/uploads
    ports:
      - "${BBSGO_HTTP_PORT:-3000}:3000"
    environment:
      BBSGO_ENV: prod
      NODE_ENV: production
      PORT: "3000"
      BBSGO_SERVER_URL: http://127.0.0.1:8082
      BBSGO_INSTALL_DOCKER_BUILTIN_MYSQL: "true"
      BBSGO_DOCKER_BUILTIN_MYSQL_HOST: mysql
      BBSGO_DOCKER_BUILTIN_MYSQL_PORT: "3306"
      BBSGO_DOCKER_BUILTIN_MYSQL_DATABASE: ${BBSGO_MYSQL_DATABASE}
      BBSGO_DOCKER_BUILTIN_MYSQL_USERNAME: ${BBSGO_MYSQL_USER}
      BBSGO_DOCKER_BUILTIN_MYSQL_PASSWORD: ${BBSGO_MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  mysql-data:
